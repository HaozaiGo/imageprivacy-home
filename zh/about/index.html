    <p class="lead">ImagePrivacy 收集用于移除图片隐藏元数据、添加图片水印的浏览器工具。</p>
    <section class="panel"><h2>为什么做这个站</h2><p>图片在分享前常常需要清理元数据，或添加轻量归属标识。ImagePrivacy 让这些流程更快、更偏向本地处理。</p></section>
