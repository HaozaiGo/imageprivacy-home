<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ImagePrivacy 收集私密的浏览器图片工具，用于移除图片元数据和添加水印。">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://imageprivacy.org/zh/">
  <link rel="alternate" hreflang="en" href="https://imageprivacy.org/">
  <link rel="alternate" hreflang="zh-CN" href="https://imageprivacy.org/zh/">
  <link rel="alternate" hreflang="x-default" href="https://imageprivacy.org/">
  <title>ImagePrivacy - 图片隐私工具导航</title>
  <style>
    :root{color-scheme:light;--ink:#1b2430;--muted:#5d6673;--line:#d9dfd9;--paper:#fbfcfa;--panel:#fff;--green:#0f8a6a;--blue:#2563eb}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}a{color:inherit}.top{position:sticky;top:0;z-index:2;border-bottom:1px solid rgba(217,223,217,.9);background:rgba(251,252,250,.92);backdrop-filter:blur(12px)}.nav{max-width:1040px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:0}.mark{width:28px;height:28px;display:grid;place-items:center;border:1px solid #b8c6be;border-radius:7px;background:#fff;color:var(--green);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px}.lang{color:var(--muted);text-decoration:none;font-size:14px}main{max-width:1040px;margin:0 auto;padding:34px 20px 56px}.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,390px);gap:28px;align-items:center;padding-bottom:24px}h1{margin:0 0 12px;font-size:44px;line-height:1.02;letter-spacing:0}.lead{margin:0;max-width:620px;color:var(--muted);font-size:18px;line-height:1.55}.scene{width:100%;aspect-ratio:16/10;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}.scene canvas{display:block;width:100%;height:100%}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:28px}.card{min-height:160px;display:flex;flex-direction:column;justify-content:space-between;gap:18px;padding:18px;border:1px solid var(--line);border-radius:8px;background:var(--panel);text-decoration:none;box-shadow:0 1px 2px rgba(27,36,48,.04)}.card:hover{border-color:#aab8ad;transform:translateY(-1px)}.card-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.card strong{font-size:18px;letter-spacing:0}.card span{color:var(--muted);font-size:14px;line-height:1.45}.icon{flex:0 0 auto;width:38px;height:38px;border-radius:7px;display:grid;place-items:center;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;background:#f3f7f3;border:1px solid #dce5de}.green{color:var(--green)}.blue{color:var(--blue)}footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}footer a{text-decoration:none}@media(max-width:800px){.intro{grid-template-columns:1fr}h1{font-size:36px}}@media(max-width:560px){main{padding-top:26px}.grid{grid-template-columns:1fr}h1{font-size:32px}.lead{font-size:16px}.scene{aspect-ratio:4/3}}
  </style>
</head>
<body>
  <header class="top"><nav class="nav" aria-label="主导航"><div class="brand"><span class="mark">IP</span><span>ImagePrivacy</span></div><a class="lang" href="/">English</a></nav></header>
  <main>
    <section class="intro" aria-labelledby="title"><div><h1 id="title">ImagePrivacy</h1><p class="lead">文件保留在浏览器里的图片隐私工具入口。</p></div><div class="scene" aria-hidden="true"><canvas id="image-scene"></canvas></div></section>
    <section class="grid" aria-label="图片隐私工具">
      <a class="card" href="https://exif.imageprivacy.org/"><div class="card-top"><strong>EXIF Remover</strong><span class="icon green">EX</span></div><span>分享图片前移除隐藏元数据。</span></a>
      <a class="card" href="https://watermark.imageprivacy.org/"><div class="card-top"><strong>Watermark Tool</strong><span class="icon blue">WM</span></div><span>在浏览器里预览并添加文字水印。</span></a>
    </section>
    <footer><span>ImagePrivacy</span><a href="/llms.txt">llms.txt</a></footer>
  </main>
  <script>
    const canvas=document.getElementById("image-scene"),ctx=canvas.getContext("2d");function draw(){const r=canvas.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,r.width,r.height);ctx.fillStyle="#fff";ctx.fillRect(0,0,r.width,r.height);const t=Date.now()/1500;for(let i=0;i<9;i++){const x=18+(i%3)*(r.width-50)/2,y=18+Math.floor(i/3)*(r.height-50)/2,w=42,h=34;ctx.fillStyle=["#eef7f1","#eef4ff","#fff7ed"][i%3];ctx.strokeStyle=["#0f8a6a","#2563eb","#b45309"][i%3];ctx.lineWidth=1.2;ctx.beginPath();ctx.roundRect(x,y,w,h,6);ctx.fill();ctx.stroke();ctx.fillStyle=ctx.strokeStyle;ctx.globalAlpha=.8;ctx.beginPath();ctx.arc(x+12+Math.sin(t+i)*2,y+12,4,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.beginPath();ctx.moveTo(x+8,y+h-8);ctx.lineTo(x+19,y+20+Math.cos(t+i)*2);ctx.lineTo(x+28,y+h-8);ctx.lineTo(x+34,y+24);ctx.lineTo(x+w-7,y+h-8);ctx.stroke()}ctx.strokeStyle="#d6ded8";ctx.lineWidth=1;for(let x=12;x<r.width;x+=24){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,r.height);ctx.stroke()}for(let y=12;y<r.height;y+=24){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(r.width,y);ctx.stroke()}requestAnimationFrame(draw)}draw();
  </script>
</body>
</html>
